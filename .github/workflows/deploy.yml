name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check changelog version
        id: changelog
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          VERSION=$(node scripts/check-release-version.mjs --notes-file "$NOTES")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          TAG="v${VERSION}"
          HEAD=$(git rev-parse HEAD)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING=$(git rev-parse "$TAG^{commit}")
            if [ "$EXISTING" = "$HEAD" ]; then
              echo "Tag $TAG already at HEAD; skipping GitHub Release"
              exit 0
            fi
            echo "Version $VERSION already tagged at $EXISTING. Add a new ## x.y.z heading in CHANGELOG.md."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "${{ steps.changelog.outputs.notes }}"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: yarp.bluewiz.net
