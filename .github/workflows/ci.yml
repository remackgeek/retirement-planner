name: CI
on:
  pull_request:
  push:
    branches: [dev]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # Explicit one-shot run (the `test` script is bare `vitest`, which relies
      # on CI env detection to avoid watch mode — be explicit here instead).
      - run: npx vitest run
      - run: npm run build
